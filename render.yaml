# Render Blueprint for VCNR_Web (Free Tier Testing)
# https://render.com/docs/blueprint-spec
#
# Render is the only deployment platform for VCNR_Web.
#
# PostgreSQL runs on Railway (https://railway.com), NOT on Render.
# See docs/free-hosting-guide.md for the step-by-step migration.
#
# Deploy steps:
#   1. Push this repo to GitHub
#   2. In Render dashboard: New + -> Blueprint -> select this repo
#   3. Render creates the web service automatically
#   4. Create the PostgreSQL DB on Railway, enable Public Access /
#      TCP Proxy (Settings -> Networking), and paste the public connection
#      string into the DATABASE_URL variable on the service Environment tab
#   5. Frontend origin is auto-detected from RENDER_EXTERNAL_URL
#      (no FRONTEND_ORIGIN manual setup needed)
#
# Free tier caveats:
#   - Service sleeps after 15 min idle, wakes in ~50s on first request
#   - Railway is a paid PostgreSQL host (trial credit, then Hobby at $5/mo)

services:
  - type: web
    name: vcnr-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: "8000"
      # PostgreSQL lives on Railway. Set this manually in the Render dashboard
      # (Environment tab) to Railway's public connection string
      # (DATABASE_PUBLIC_URL after enabling the TCP proxy).
      # `sync: false` keeps the value out of git and stops Blueprint syncs
      # from overwriting it.
      - key: DATABASE_URL
        sync: false
      # RENDER_EXTERNAL_URL is set automatically by Render.
      # The backend uses it as the frontend origin for CORS and webseed URLs.
      - key: SWARM_STUN_URL
        value: stun:stun.l.google.com:19302
        # Optional: add your TURN server credentials here for better swarm connectivity:
      # - key: SWARM_TURN_URL
      #   sync: false
      # - key: SWARM_TURN_USERNAME
      #   sync: false
      # - key: SWARM_TURN_CREDENTIAL
      #   sync: false
      # Optional Cloudflare R2 permanent storage for encrypted content chunks.
      # Set these in the Render dashboard (Environment) after creating the R2 bucket:
      #   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
      #   R2_BUCKET_NAME, R2_PUBLIC_BASE_URL
      # - key: R2_ACCOUNT_ID
      #   sync: false
      # - key: R2_ACCESS_KEY_ID
      #   sync: false
      # - key: R2_SECRET_ACCESS_KEY
      #   sync: false
      # - key: R2_BUCKET_NAME
      #   sync: false
      # - key: R2_PUBLIC_BASE_URL
      #   sync: false
