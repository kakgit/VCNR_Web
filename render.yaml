# Render Blueprint for VCNR_Web (Free Tier Testing)
# https://render.com/docs/blueprint-spec
#
# Render is the only deployment platform for VCNR_Web.
#
# Deploy steps:
#   1. Push this repo to GitHub
#   2. In Render dashboard: New + -> Blueprint -> select this repo
#   3. Render creates the web service + PostgreSQL automatically
#   4. Frontend origin is auto-detected from RENDER_EXTERNAL_URL
#      (no FRONTEND_ORIGIN manual setup needed)
#
# Free tier caveats:
#   - Service sleeps after 15 min idle, wakes in ~50s on first request
#   - Free PostgreSQL expires after 30 days (use Neon for permanent free DB)

databases:
  - name: vcnr-postgres
    databaseName: cineproxima
    user: vcnr
    plan: free
    # Free Postgres on Render expires after 30 days.
    # For permanent free storage use Neon: https://neon.tech (see docs/free-hosting-guide.md)

services:
  - type: web
    name: vcnr-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: vcnr-postgres
          property: connectionString
      # RENDER_EXTERNAL_URL is set automatically by Render.
      # The backend uses it as the frontend origin for CORS and webseed URLs.
      - key: SWARM_STUN_URL
        value: stun:stun.l.google.com:19302
        # Optional: add your TURN server credentials here for better swarm connectivity:
      # - key: SWARM_TURN_URL
      #   sync: false
      # - key: SWARM_TURN_USERNAME
      #   sync: false
      # - key: SWARM_TURN_CREDENTIAL
      #   sync: false
      # Optional Cloudflare R2 permanent storage for encrypted content chunks.
      # Set these in the Render dashboard (Environment) after creating the R2 bucket:
      #   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
      #   R2_BUCKET_NAME, R2_PUBLIC_BASE_URL
      # - key: R2_ACCOUNT_ID
      #   sync: false
      # - key: R2_ACCESS_KEY_ID
      #   sync: false
      # - key: R2_SECRET_ACCESS_KEY
      #   sync: false
      # - key: R2_BUCKET_NAME
      #   sync: false
      # - key: R2_PUBLIC_BASE_URL
      #   sync: false
